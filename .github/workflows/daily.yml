name: Gallery report sync

on:
  workflow_dispatch:             # manual "Run workflow" button
    inputs:
      force_email:
        description: "Send the email digest now, regardless of time of day"
        type: boolean
        default: false
      reprocess:
        description: "Re-parse all stored reports (backfill after a parser change)"
        type: boolean
        default: false
  schedule:
    # Poll the inbox often so the dashboard updates shortly after each report
    # email arrives. Runs are cheap and no-op unless a new report is found; the
    # dashboard is redeployed only when the data actually changes.
    #
    # GitHub's scheduler is best-effort: it delays or drops scheduled runs under
    # load, and congestion is worst at the top of the hour and the quarter marks
    # (:00 :15 :30 :45). So we deliberately fire every 5 min at OFF-peak minutes
    # (never on those marks) to maximise the chance GitHub grants a run promptly.
    # Whenever a run does fire it catches up on every email missed since the last
    # one, so a skipped slot only delays the update — it never loses a report.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write                # commit updated data/readings.json
  pages: write                   # deploy Pages
  id-token: write                # Pages OIDC

concurrency:
  group: artheart-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run pipeline (ingest + aggregate + build site data)
        env:
          ARTHEART_IMAP_USER: ${{ secrets.ARTHEART_IMAP_USER }}
          ARTHEART_IMAP_PASSWORD: ${{ secrets.ARTHEART_IMAP_PASSWORD }}
          ARTHEART_FORCE_EMAIL: ${{ inputs.force_email }}
          ARTHEART_REINGEST: ${{ inputs.reprocess }}
          ARTHEART_EMAIL_FROM: ${{ vars.ARTHEART_EMAIL_FROM }}
          ARTHEART_EMAIL_TO: ${{ vars.ARTHEART_EMAIL_TO }}
          ARTHEART_DASHBOARD_URL: ${{ vars.ARTHEART_DASHBOARD_URL }}
        run: python -m artheart.pipeline
      - name: Detect new data
        id: diff
        run: |
          # readings.json changes only when a new report was ingested; the
          # dashboard is a deterministic function of it, so this is the signal.
          if git diff --quiet -- data/readings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit data (readings + email marker)
        run: |
          git config user.name  "artheart-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "data: update [skip ci]"; git push; }
      - name: Upload site artifact
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
