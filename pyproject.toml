[project]
name = "artheart"
version = "0.1.0"
description = "Daily CBMAA gallery-condition report aggregator"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
