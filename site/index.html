<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>artheart — Gallery Conditions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1120; --surface:#0f1928; --card:#111d35; --elevated:#16243f; --overlay:#1c2e4a;
    --teal:#3dd6c8; --teal-bright:#5ce8db; --teal-dim:rgba(61,214,200,.12);
    --blue:#4fa3e0; --blue-dim:rgba(79,163,224,.12);
    --ink:#ffffff; --sec:#8baec8; --muted:#4d6a85;
    --border:rgba(61,214,200,.20); --subtle:rgba(255,255,255,.07);
    --warning:#f0a830; --error:#e05656; --error-dim:rgba(224,86,86,.14);
    --sans:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"Space Mono","DejaVu Sans Mono",ui-monospace,monospace;
    --r-lg:10px; --r-md:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    background-image:radial-gradient(rgba(61,214,200,.05) 1px,transparent 1px);
    background-size:24px 24px;}
  a{color:var(--teal)}
  .wrap{max-width:1180px;margin:0 auto;padding:24px}
  /* Topbar */
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--subtle);padding-bottom:18px;margin-bottom:22px}
  .brand{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .brand b{color:var(--teal)}
  .brand small{display:block;font-size:12px;font-weight:400;color:var(--sec);
    letter-spacing:.3px;margin-top:2px}
  .spacer{flex:1}
  .facility{font-family:var(--mono);font-size:12px;color:var(--sec);
    text-transform:uppercase;letter-spacing:1px;text-align:right}
  select{background:var(--elevated);color:var(--ink);border:1px solid var(--border);
    border-radius:var(--r-md);padding:9px 12px;font-family:var(--mono);font-size:13px;cursor:pointer}
  /* Cards */
  .card{background:var(--card);border:1px solid var(--subtle);border-radius:var(--r-lg);
    padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:box-shadow .18s ease,border-color .18s ease}
  .card:hover{box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 24px rgba(61,214,200,.15)}
  .label{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--sec);display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .label::before{content:"";width:16px;height:2px;background:var(--teal);display:inline-block}
  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--subtle);border-radius:var(--r-lg);padding:18px}
  .kpi .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--sec)}
  .kpi .v{font-family:var(--mono);font-size:34px;font-weight:700;margin-top:8px;line-height:1}
  .kpi .u{font-size:15px;color:var(--muted)}
  .kpi.alert .v{color:var(--error)} .kpi.good .v{color:var(--teal)}
  .hero{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
    box-shadow:0 0 28px rgba(61,214,200,.12);display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
  .hero.alert{background:#1b1214;border-color:rgba(224,86,86,.45);box-shadow:0 0 28px rgba(224,86,86,.15)}
  .hero-top{display:flex;align-items:center;gap:14px}
  .hero-icon{flex-shrink:0;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--teal-dim);border:1px solid var(--border)}
  .hero.alert .hero-icon{background:rgba(224,86,86,.14);border-color:rgba(224,86,86,.45)}
  .hero-title{font-size:19px;font-weight:600;line-height:1.2}
  .hero-sub{font-family:var(--mono);font-size:12px;color:var(--sec);margin-top:4px}
  .hero.alert .hero-sub{color:#f3b0b0}
  .hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .hero-stat{background:var(--elevated);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 8px;text-align:center}
  .hero-stat .v{font-family:var(--mono);font-size:22px;font-weight:700}
  .hero-stat.good .v{color:var(--teal)} .hero-stat.alert .v{color:var(--error)}
  .hero-stat .k{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--sec);margin-top:3px}
  .stale{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;align-self:center}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:20px}
  /* zone card internals */
  .zhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
  .zname{font-family:var(--mono);font-weight:700;font-size:15px;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{flex-shrink:0}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:999px}
  .pill.ok{background:var(--teal-dim);color:var(--teal)}
  .pill.bad{background:var(--error-dim);color:#f2a3a3}
  .metric{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
  .metric .dot{width:9px;height:9px;border-radius:50%}
  .metric .mv{font-family:var(--mono);font-size:20px;font-weight:700}
  .metric .ml{font-size:11px;color:var(--sec);text-transform:uppercase;letter-spacing:.5px}
  .metric .adh{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--sec)}
  svg text{pointer-events:none}  /* labels never steal hover from the marks */
  svg .grid{stroke:var(--subtle);stroke-width:1}
  svg .axis{fill:var(--muted);font-family:var(--mono);font-size:10px}
  svg .band{fill:rgba(61,214,200,.07)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--sec);font-family:var(--mono);margin-bottom:6px}
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .legend2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
  .legend2 span{font-family:var(--mono);font-size:12px;color:var(--sec);display:inline-flex;align-items:center;gap:6px}
  .legend2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .uh{color:var(--sec);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 2px}
  .hm{display:grid;grid-template-columns:minmax(80px,1.5fr) 1fr 1fr;gap:6px;align-items:center}
  .hm-h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:center;font-family:var(--mono)}
  .hm-z{color:var(--sec);font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hm-cell{border-radius:6px;padding:9px 4px;text-align:center;font-family:var(--mono);font-size:13px;color:#eaf6f4;cursor:pointer}
  .hm-cell.out{box-shadow:0 0 0 2px var(--error) inset}
  .exc{background:#160f14;border:1px solid #3b1113;border-radius:var(--r-md);padding:10px 12px;
    margin:8px 0;color:#f2a3a3;font-family:var(--mono);font-size:13px;display:flex;gap:10px;align-items:center}
  .exc b{color:#ffd0d0}
  .clean{color:var(--teal);font-family:var(--mono);font-size:14px;padding:10px 0}
  .note{color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:8px}
  details{margin-top:16px} summary{cursor:pointer;color:var(--sec);font-family:var(--mono);font-size:12px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  table.tbl th,table.tbl td{padding:7px 8px;border-bottom:1px solid var(--subtle);text-align:left;font-family:var(--mono)}
  table.tbl th{color:var(--muted);font-size:11px;text-transform:uppercase}
  footer{color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center;padding:26px 0}
  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--overlay);
    border:1px solid var(--border);border-radius:var(--r-md);padding:7px 10px;font-family:var(--mono);
    font-size:12px;color:var(--ink);box-shadow:0 8px 40px rgba(0,0,0,.6);z-index:50;white-space:nowrap}
  .empty{padding:60px 20px;text-align:center;color:var(--sec);font-family:var(--mono)}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">
  <div class="top">
    <div class="brand">art<b>heart</b><small>Gallery Condition Intelligence</small></div>
    <div class="spacer"></div>
    <div class="facility" id="facility">—</div>
    <select id="datesel" aria-label="Select day"></select>
  </div>
  <div id="app"><div class="empty">Loading…</div></div>
  <footer>artheart · automated gallery-condition aggregator · <span id="foot"></span></footer>
</div>
<script>
const C={teal:"#3dd6c8",blue:"#4fa3e0",error:"#e05656",muted:"#4d6a85",sec:"#8baec8",ink:"#fff"};
// Categorical hues for the per-unit Unit Overview. First 8 are the well-separated
// Okabe–Ito(+teal) set; the rest add headroom (16 total) as more units are added.
// Beyond ~8 the legend + tap tooltips carry identity, not color alone.
const CAT=["#e69f00","#56b4e9","#009e73","#f0e442","#0072b2","#d55e00","#cc79a7","#3dd6c8",
           "#f781bf","#a6d854","#b3a2ff","#e15759","#c93fb0","#7a5cff","#00a2b3","#c9a227"];
const tip=document.getElementById("tip");
const fmt=(v,u="")=>v==null?"—":`${v}${u}`;
let pinnedEl=null;                       // a mark whose tooltip is held open by a tap/click
function positionTip(x,y){const r=tip.getBoundingClientRect();let nx=x+14,ny=y-r.height-12;
  if(nx+r.width>innerWidth-8)nx=innerWidth-r.width-8; if(nx<8)nx=8; if(ny<8)ny=y+20;
  tip.style.left=nx+"px";tip.style.top=ny+"px";}
function showTip(html,x,y){tip.innerHTML=html;tip.style.opacity=1;positionTip(x,y);}
function hideTip(){tip.style.opacity=0;pinnedEl=null;}
// Bind a chart mark: hover previews on desktop; tap opens & pins on mobile,
// tap again (or tap off the mark) dismisses. htmlFor(evt) -> tooltip HTML.
function bindTip(el, htmlFor){
  el.style.cursor="pointer";
  el.addEventListener("mouseenter",e=>{ if(!pinnedEl) showTip(htmlFor(e),e.clientX,e.clientY); });
  el.addEventListener("mousemove", e=>{ if(!pinnedEl) positionTip(e.clientX,e.clientY); });
  el.addEventListener("mouseleave",()=>{ if(!pinnedEl) tip.style.opacity=0; });
  el.addEventListener("click", e=>{
    e.stopPropagation();                 // keep the off-mark dismiss handler from firing
    if(pinnedEl===el){ hideTip(); return; }
    pinnedEl=el; showTip(htmlFor(e), e.clientX, e.clientY);
  });
}
// Dismiss on scroll/resize, or on any tap/click that isn't on a mark (marks
// stopPropagation, so this only sees off-mark taps).
["scroll","wheel","resize"].forEach(ev=>
  window.addEventListener(ev, hideTip, {passive:true, capture:true}));
document.addEventListener("click", hideTip);
function svgPt(svg,evt){const p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());}

let DATA=null, DATE=null, LAST_CAPTURE=null;

fetch("./data/dashboard.json?"+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d; DATE=d.latest;
  document.getElementById("facility").textContent=d.facility||"";
  document.getElementById("foot").textContent="updated "+(d.latest||"");
  const sel=document.getElementById("datesel");
  sel.innerHTML=(d.dates||[]).slice().reverse().map(dt=>`<option value="${dt}">${dt}</option>`).join("");
  sel.value=DATE; sel.onchange=e=>{DATE=e.target.value;render();};
  render();
}).catch(()=>{document.getElementById("app").innerHTML=
  '<div class="empty">No data yet — run the pipeline to publish the first report.</div>';});

function render(){
  hideTip();                             // clear any pinned tooltip when the view rebuilds
  const day=DATA.days[DATE]; if(!day){return;}
  const zones=day.zones||[], exc=day.excursions||[];
  LAST_CAPTURE=(day.generated_at_list||[]).slice(-1)[0]||null;
  const app=document.getElementById("app");
  app.innerHTML=`
    ${statusHero(day, zones)}
    <div class="grid2">
      <div class="card"><div class="label">Band adherence over time</div>
        <div class="legend"><span><i style="background:${C.teal}"></i>Temp %</span>
        <span><i style="background:${C.blue}"></i>Humidity %</span></div>
        <div id="trend"></div></div>
      <div class="card"><div class="label">Gallery heatmap</div><div id="heat"></div></div>
    </div>
    <div class="label" style="margin:4px 2px 12px">Zones — intraday snapshots vs band
      <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400">
      (temp 68–72 °F · RH 45–55 %)</span></div>
    <div class="zones" id="zones"></div>
    <div class="card"><div class="label">Unit Overview — all captures
      <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400">
      (every AHU, each email capture)</span></div>
      <div id="unit-legend" class="legend2"></div>
      <div class="uh">Temperature °F · band ${(DATA.temp_band||[68,72]).join("–")} · scale 0–100</div><div id="unit-temp"></div>
      <div class="uh">Humidity % · band ${(DATA.rh_band||[45,55]).join("–")} · scale 0–100</div><div id="unit-rh"></div></div>
    <div class="card"><div class="label">Excursion log — ${DATE}</div><div id="exc"></div></div>
    ${tableView(day)}
  `;
  drawTrend(document.getElementById("trend"));
  drawHeat(document.getElementById("heat"),zones);
  const zc=document.getElementById("zones");
  const worstFirst=zones.slice().sort((a,b)=>{
    const ao=a.in_band===false?0:1, bo=b.in_band===false?0:1;
    if(ao!==bo) return ao-bo;                       // out-of-band galleries first
    const am=Math.min(a.temp_adherence??101,a.rh_adherence??101);
    const bm=Math.min(b.temp_adherence??101,b.rh_adherence??101);
    return am-bm;                                    // then lowest adherence
  });
  worstFirst.forEach(z=>zc.appendChild(zoneCard(z)));
  drawUnit();
  const el=document.getElementById("exc");
  el.innerHTML = exc.length ? exc.map(e=>{
    const u=e.metric==="temp"?"°F":"%";
    return `<div class="exc">⚠ <span><b>${e.zone}</b> — ${e.metric.toUpperCase()} `+
      `${e.value}${u} outside ${e.band_lo}–${e.band_hi}${u}`+
      `${e.at?` · ${e.at.replace("T"," ")}`:""}</span></div>`;}).join("")
    : `<div class="clean">✓ All zones within band for the selected day.</div>`;
}

const avg=a=>{const v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length*10)/10:null;};
function kpi(k,v,u,cls=""){return `<div class="kpi ${cls}"><div class="k">${k}</div>
  <div class="v">${v}<span class="u">${u}</span></div></div>`;}
function hhmm(iso){ if(!iso) return ""; const t=(iso.split("T")[1]||"").split(":");
  let h=+t[0]; const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${t[1]||"00"} ${ap}`; }
function heroStat(k,v,cls=""){return `<div class="hero-stat ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`;}
function statusHero(day, zones){
  const out=zones.filter(z=>z.in_band===false);
  const total=day.zone_count||zones.length;
  const inRange=total-out.length;
  const overall=avg([avg(zones.map(z=>z.temp_adherence)),avg(zones.map(z=>z.rh_adherence))]);
  const lastAt=(day.generated_at_list||[]).slice(-1)[0];
  const clear=out.length===0;
  const icon=clear
    ? `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${C.teal}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`
    : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${C.error}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
  const title=clear?"All galleries in range"
    :`${out.length} galler${out.length===1?"y":"ies"} need${out.length===1?"s":""} attention`;
  const sub=(clear?`No excursions`:`${inRange} of ${total} in range`)+(lastAt?` · as of ${hhmm(lastAt)}`:"");
  return `<div class="hero${clear?"":" alert"}">
    <div class="hero-top"><div class="hero-icon">${icon}</div>
      <div style="flex:1;min-width:0"><div class="hero-title">${title}</div>
        <div class="hero-sub">${sub}</div></div></div>
    <div class="hero-stats">
      ${heroStat("In range",`${inRange}/${total}`,clear?"good":"")}
      ${heroStat("Excursions",day.excursion_count,day.excursion_count?"alert":"good")}
      ${heroStat("Adherence",overall==null?"—":overall+"%",overall!=null&&overall<95?"alert":(overall!=null&&overall>=99.5?"good":""))}
    </div></div>`;
}

/* ---- per-zone card with two sparklines ---- */
function zoneCard(z){
  const el=document.createElement("div"); el.className="card";
  const bad=z.in_band===false;
  const rhAt=(z.rh_series||[]).filter(p=>p.value!=null).slice(-1)[0];
  const rhStale=rhAt&&LAST_CAPTURE&&rhAt.at<LAST_CAPTURE;
  el.innerHTML=`<div class="zhead"><span class="zname" title="${z.zone}">${z.zone}</span>
    <span class="pill ${bad?"bad":"ok"}">${bad?"OUT OF BAND":"IN BAND"}</span></div>
    <div class="metric"><span class="dot" style="background:${C.teal}"></span>
      <span class="mv">${fmt(z.temp.latest)}</span><span class="ml">°F temp</span>
      <span class="adh">${fmt(z.temp_adherence,"%")} in band</span></div>
    <div class="sp" data-k="temp"></div>
    <div class="metric"><span class="dot" style="background:${C.blue}"></span>
      <span class="mv">${fmt(z.rh.latest)}</span><span class="ml">% humidity</span>
      <span class="adh">${z.rh.latest==null?"no humidity":fmt(z.rh_adherence,"%")+" in band"}</span></div>
    ${rhStale?`<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin:-2px 0 2px 19px">humidity as of ${hhmm(rhAt.at)}</div>`:""}
    <div class="sp" data-k="rh"></div>`;
  el.querySelectorAll(".sp").forEach(s=>{
    const k=s.dataset.k;
    spark(s, k==="temp"?z.temp_series:z.rh_series, k==="temp"?z.temp_band:z.rh_band,
          k==="temp"?C.teal:C.blue, k==="temp"?"°F":"%", z.zone);
  });
  return el;
}
function spark(host,series,band,color,unit,zone){
  const W=300,H=76,PL=30,PR=10,PT=10,PB=16, iw=W-PL-PR, ih=H-PT-PB;
  const pts=series.map((p,i)=>({...p,i})).filter(p=>p.value!=null);
  const vals=pts.map(p=>p.value);
  let lo=Math.min(band[0],...(vals.length?vals:[band[0]]))-1;
  let hi=Math.max(band[1],...(vals.length?vals:[band[1]]))+1;
  if(hi-lo<2){lo-=1;hi+=1;}
  const n=series.length;
  const X=i=>PL+(n<=1?iw/2:iw*i/(n-1));
  const Y=v=>PT+ih-ih*(v-lo)/(hi-lo);
  const by0=Y(band[1]),by1=Y(band[0]);
  const line=pts.map((p,k)=>`${k?"L":"M"}${X(p.i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" ");
  const dots=pts.map(p=>{const out=p.value<band[0]||p.value>band[1];
    return `<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="4"
      fill="${out?C.error:color}" stroke="var(--card)" stroke-width="1.5"
      data-v="${p.value}" data-at="${p.at||""}" data-out="${out?1:0}"/>`;}).join("");
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <rect class="band" x="${PL}" y="${by0.toFixed(1)}" width="${iw}" height="${(by1-by0).toFixed(1)}"/>
    <line class="grid" x1="${PL}" y1="${by0.toFixed(1)}" x2="${PL+iw}" y2="${by0.toFixed(1)}"/>
    <line class="grid" x1="${PL}" y1="${by1.toFixed(1)}" x2="${PL+iw}" y2="${by1.toFixed(1)}"/>
    <text class="axis" x="4" y="${by0+3}">${band[1]}</text>
    <text class="axis" x="4" y="${by1+3}">${band[0]}</text>
    ${pts.length>1?`<path d="${line}" fill="none" stroke="${color}" stroke-width="2"
       stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${dots}</svg>`;
  host.querySelector("svg").querySelectorAll("circle").forEach(c=>{
    bindTip(c, ()=>{const out=c.dataset.out==="1";
      return `<b>${zone}</b> · ${c.dataset.at.replace("T"," ")}<br>${c.dataset.v}${unit}`+
        (out?` <span style="color:${C.error}">out of band</span>`:"");});
  });
}

/* ---- adherence over time (two series, one axis 0–100) ---- */
function drawTrend(host){
  const dates=DATA.dates||[];
  const T=dates.map(d=>({d,v:avg((DATA.days[d].zones||[]).map(z=>z.temp_adherence))}));
  const R=dates.map(d=>({d,v:avg((DATA.days[d].zones||[]).map(z=>z.rh_adherence))}));
  const W=560,H=220,PL=34,PR=48,PT=14,PB=28, iw=W-PL-PR, ih=H-PT-PB;
  const n=dates.length;
  const X=i=>PL+(n<=1?iw/2:iw*i/(n-1));
  const lo=Math.min(90,...[...T,...R].map(p=>p.v).filter(v=>v!=null),100)-2;
  const Y=v=>PT+ih-ih*(v-lo)/(100-lo);
  const mkPath=A=>A.map((p,i)=>p.v==null?null:`${i&&A[i-1].v!=null?"L":"M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`)
    .filter(Boolean).join(" ");
  const mkDots=(A,col)=>A.map((p,i)=>p.v==null?"":`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}"
    r="${p.d===DATE?5:3.5}" fill="${col}" stroke="var(--card)" stroke-width="1.5"
    data-d="${p.d}" data-v="${p.v}" data-m="${col===C.teal?'Temp':'Humidity'}"/>`).join("");
  const yticks=[lo,(lo+100)/2,100].map(v=>`<line class="grid" x1="${PL}" y1="${Y(v).toFixed(1)}"
    x2="${PL+iw}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="4" y="${(Y(v)+3).toFixed(1)}">${Math.round(v)}</text>`).join("");
  const sel=dates.indexOf(DATE);
  const selMark=sel>=0?`<line x1="${X(sel).toFixed(1)}" y1="${PT}" x2="${X(sel).toFixed(1)}" y2="${PT+ih}"
    stroke="${C.muted}" stroke-dasharray="3 3"/>`:"";
  const endLbl=(A,col)=>{for(let i=A.length-1;i>=0;i--)if(A[i].v!=null)
    return `<text x="${(X(i)+6).toFixed(1)}" y="${(Y(A[i].v)+3).toFixed(1)}" fill="${col}"
      font-family="var(--mono)" font-size="11">${A[i].v}%</text>`;return"";};
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${yticks}${selMark}
    ${n>1?`<path d="${mkPath(T)}" fill="none" stroke="${C.teal}" stroke-width="2" stroke-linejoin="round"/>
    <path d="${mkPath(R)}" fill="none" stroke="${C.blue}" stroke-width="2" stroke-linejoin="round"/>`:""}
    ${mkDots(T,C.teal)}${mkDots(R,C.blue)}${endLbl(T,C.teal)}${endLbl(R,C.blue)}
    <text class="axis" x="${PL}" y="${H-8}">${dates[0]||""}</text>
    <text class="axis" x="${PL+iw}" y="${H-8}" text-anchor="end">${dates[n-1]||""}</text>
  </svg>${n<=1?'<div class="note">History builds as more days are collected — one day so far.</div>':""}`;
  host.querySelector("svg").querySelectorAll("circle").forEach(c=>{
    bindTip(c, ()=>`<b>${c.dataset.m}</b> · ${c.dataset.d}<br>${c.dataset.v}% in band`);
  });
}

/* ---- heatmap: zones × [Temp,RH] as an HTML grid (long labels fit) ---- */
function drawHeat(host,zones){
  const ramp=p=>{ if(p==null) return "rgba(77,106,133,.25)";
    const t=Math.max(0,Math.min(1,(p-80)/20)); return `rgba(61,214,200,${(.12+t*.78).toFixed(2)})`; };
  function cell(pct,out,zone,metric){
    const d=document.createElement("div");
    d.className="hm-cell"+(out?" out":"");
    d.style.background=ramp(pct);
    d.textContent = pct==null?"—":pct+"%";
    bindTip(d, ()=>`<b>${zone}</b> · ${metric}<br>${pct==null?"—":pct+"% in band"}`);
    return d;
  }
  host.innerHTML="";
  const grid=document.createElement("div"); grid.className="hm";
  ["","Temp","RH"].forEach(h=>{const e=document.createElement("div");e.className="hm-h";e.textContent=h;grid.appendChild(e);});
  zones.forEach(z=>{
    const lbl=document.createElement("div"); lbl.className="hm-z"; lbl.textContent=z.zone; lbl.title=z.zone;
    grid.appendChild(lbl);
    const tOut=z.temp.latest!=null&&(z.temp.latest<z.temp_band[0]||z.temp.latest>z.temp_band[1]);
    const rOut=z.rh.latest!=null&&(z.rh.latest<z.rh_band[0]||z.rh.latest>z.rh_band[1]);
    grid.appendChild(cell(z.temp_adherence,tOut,z.zone,"Temp"));
    grid.appendChild(cell(z.rh_adherence,rOut,z.zone,"RH"));
  });
  host.appendChild(grid);
}

/* ---- Unit Overview: all AHUs, temp & humidity, every capture over time ---- */
function _zoneSort(a,b){
  const na=(a.match(/AHU\s*-?\s*(\d+)/)||[])[1], nb=(b.match(/AHU\s*-?\s*(\d+)/)||[])[1];
  if(na!=null&&nb!=null) return (+na)-(+nb);
  return a<b?-1:1;
}
function buildUnitSeries(){
  const zset=new Set();
  DATA.dates.forEach(d=>(DATA.days[d].zones||[]).forEach(z=>zset.add(z.zone)));
  const ahus=[...zset].sort(_zoneSort);
  const colors={}; ahus.forEach((z,i)=>colors[z]=CAT[i%CAT.length]);
  const caps=[];                               // one entry per email capture, chronological
  DATA.dates.forEach(d=>[...new Set(DATA.days[d].generated_at_list||[])].sort()
    .forEach(at=>caps.push({date:d,at})));
  const idx={}; caps.forEach((c,i)=>idx[c.date+"|"+c.at]=i);
  const temp={},rh={}; ahus.forEach(z=>{temp[z]=[];rh[z]=[];});
  DATA.dates.forEach(d=>(DATA.days[d].zones||[]).forEach(z=>{
    (z.temp_series||[]).forEach(p=>{const i=idx[d+"|"+p.at]; if(i!=null&&p.value!=null)temp[z.zone].push({i,at:p.at,v:p.value});});
    (z.rh_series||[]).forEach(p=>{const i=idx[d+"|"+p.at]; if(i!=null&&p.value!=null)rh[z.zone].push({i,at:p.at,v:p.value});});
  }));
  return {ahus,colors,caps,
    temp:ahus.map(z=>({name:z,color:colors[z],points:temp[z]})),
    rh:ahus.map(z=>({name:z,color:colors[z],points:rh[z]}))};
}
function multiLine(host, series, band, unit, caps){
  const N=caps.length, W=560,H=200,PL=32,PR=14,PT=10,PB=24, iw=W-PL-PR, ih=H-PT-PB;
  const X=i=> N<=1?PL+iw/2 : PL+iw*i/(N-1);
  const lo=0, hi=100;                        // fixed full-scale axis so nothing clips
  const Y=v=>PT+ih-ih*(v-lo)/(hi-lo);
  const by0=Y(band[1]),by1=Y(band[0]);
  let s=`<rect class="band" x="${PL}" y="${by0.toFixed(1)}" width="${iw}" height="${(by1-by0).toFixed(1)}"/>`;
  // faint band edges for context, then the 0/50/100 scale
  [band[0],band[1]].forEach(b=> s+=`<line x1="${PL}" y1="${Y(b).toFixed(1)}" x2="${PL+iw}" y2="${Y(b).toFixed(1)}" stroke="var(--teal)" stroke-opacity="0.25" stroke-width="1"/>`);
  [0,50,100].forEach(b=> s+=`<line class="grid" x1="${PL}" y1="${Y(b).toFixed(1)}" x2="${PL+iw}" y2="${Y(b).toFixed(1)}"/><text class="axis" x="4" y="${(Y(b)+3).toFixed(1)}">${b}</text>`);
  series.forEach(se=>{
    if(se.points.length>1){
      const dp=se.points.map((p,k)=>`${k?"L":"M"}${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
      s+=`<path d="${dp}" fill="none" stroke="${se.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"/>`;
    }
    se.points.forEach(p=> s+=`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${se.color}" stroke="var(--card)" stroke-width="1" data-z="${se.name}" data-at="${p.at}" data-v="${p.v}"/>`);
  });
  if(N){ s+=`<text class="axis" x="${PL}" y="${H-6}">${caps[0].date}</text>`;
         s+=`<text class="axis" x="${PL+iw}" y="${H-6}" text-anchor="end">${caps[N-1].date}</text>`; }
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
  host.querySelectorAll("circle").forEach(c=>
    bindTip(c, ()=>`<b>${c.dataset.z}</b> · ${c.dataset.at.replace("T"," ")}<br>${c.dataset.v}${unit}`));
}
function drawUnit(){
  const u=buildUnitSeries();
  document.getElementById("unit-legend").innerHTML =
    u.ahus.map(z=>`<span><i style="background:${u.colors[z]}"></i>${z}</span>`).join("");
  multiLine(document.getElementById("unit-temp"), u.temp, DATA.temp_band||[68,72], "°F", u.caps);
  multiLine(document.getElementById("unit-rh"),   u.rh,   DATA.rh_band||[45,55], "%",  u.caps);
}

/* ---- accessible table view ---- */
function tableView(day){
  const rows=(day.zones||[]).map(z=>`<tr><td>${z.zone}</td><td>${fmt(z.temp.latest)}</td>
    <td>${fmt(z.rh.latest)}</td><td>${fmt(z.temp_adherence,"%")}</td>
    <td>${fmt(z.rh_adherence,"%")}</td><td>${z.in_band===false?"OUT":"in band"}</td></tr>`).join("");
  return `<details><summary>Show data table (${DATE})</summary>
    <table class="tbl"><thead><tr><th>AHU</th><th>Temp °F</th><th>RH %</th>
    <th>Temp adh.</th><th>RH adh.</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></details>`;
}
</script>
